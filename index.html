<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockchain — An Interactive Introduction</title>
    <script>
      // When hosted on GitHub Pages static hosting, redirect to the bundled single-file presentation
      if (window.location.hostname.includes("github.io")) {
        var path = window.location.pathname;
        if (!path.includes("/dist/") && !path.includes("/docs/")) {
          var base = path.endsWith("/") ? path : path + "/";
          window.location.replace(base + "dist/index.html" + window.location.search + window.location.hash);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
